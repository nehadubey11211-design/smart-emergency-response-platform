# FILE: deployement/docker-compose.yml
# =========================================================
# Full local stack: PostgreSQL + Redis + FastAPI + React
# =========================================================
#
# Run from the `deployement/` folder:
#   docker-compose up --build
#
# This file's build contexts point at ".." (the repo root) because
# deployement/Dockerfile's COPY instructions are written relative to
# the repo root (e.g. "COPY backend/requirements.txt .").

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: emergency_user
      POSTGRES_PASSWORD: emergency_pass
      POSTGRES_DB: emergency_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ../database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emergency_user -d emergency_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (OTP storage) ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: deployement/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # NOTE: this uses the local Postgres container above, NOT Neon.
      # db.py auto-detects "neon.tech" in the URL and only applies Neon-
      # specific SSL/pooling settings when it's present — a plain
      # postgresql:// URL like this works fine against local Postgres.
      DATABASE_URL: postgresql+asyncpg://emergency_user:emergency_pass@db:5432/emergency_db
      REDIS_URL: redis://redis:6379
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in deployement/.env - generate with python -c 'import secrets; print(secrets.token_hex(32))'}"
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      DEBUG: "false"
      ENVIRONMENT: production
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── React Frontend (built + served via nginx) ───────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: deployement/Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
    