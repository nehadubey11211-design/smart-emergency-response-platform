# FILE: deployement/nginx.conf
# Serves the Vite build output and falls back to index.html for any
# unmatched path, so React Router's client-side routes (e.g. /forgot-password)
# work on a hard refresh instead of 404ing.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively; index.html stays uncached
    # so deploys are picked up immediately.
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
